# Docker Compose otimizado para deploy direto no EasyPanel (Tipo: Compose)
services:
  bot:
    build:
      context: https://github.com/viniciusm49/water-reminder-bot.git#master
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3333"
    environment:
      - PORT=3333
      - TZ=America/Sao_Paulo
      - REMINDER_TIMEZONE=America/Sao_Paulo
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-water-bot}
      - WATER_TARGET_GROUP_JID=${WATER_TARGET_GROUP_JID}
      - WATER_REMINDER_CRON=${WATER_REMINDER_CRON:-0 8-20/1 * * *}
      - WATER_REMINDER_ENABLED=${WATER_REMINDER_ENABLED:-true}
      - WATER_FOLLOWUP_DELAY_MINUTES=${WATER_FOLLOWUP_DELAY_MINUTES:-60}
      - BOT_PHONE_NUMBER=${BOT_PHONE_NUMBER:-}
      - BOT_NAME=${BOT_NAME:-}
    depends_on:
      - evolution_api

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    expose:
      - "8080"
    environment:
      - SERVER_URL=${SERVER_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_secret_pass@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_VERSION=
      - LOG_BAILEYS=error
      - LOG_LEVEL=ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_secret_pass
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redis:
